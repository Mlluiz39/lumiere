<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel · Lumière</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .admin{max-width:1000px;margin-inline:auto;padding:40px 20px 80px}
  .admin h1{font-size:32px;margin-bottom:8px}
  .admin .sub{color:var(--muted);font-size:13px;margin-bottom:32px}
  .card{background:#fff;border:1px solid var(--line);padding:24px;margin-bottom:24px}
  .card h2{font-size:20px;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 20px;border:1px solid var(--wine);background:var(--wine);color:#fff;font-size:13px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:none;color:var(--wine)}
  .btn.danger{border-color:#a33;color:#a33;background:none}
  .items{display:flex;flex-direction:column;gap:10px}
  .item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);background:var(--paper)}
  .item img{width:56px;height:70px;object-fit:cover;background:var(--cream)}
  .item h3{font-size:15px;font-family:var(--sans)}
  .item .meta{font-size:10px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
  .item .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .item .acts .btn{min-height:36px;padding:8px 12px;font-size:11px}
  .msg{font-size:13px;margin-top:12px;min-height:20px}
  .msg.err{color:#a33}
  .msg.ok{color:#26734c}
  .hide{display:none!important}
  #preview{width:120px;height:150px;object-fit:cover;background:var(--cream);margin-top:10px;display:block}
  @media(max-width:600px){.row{grid-template-columns:1fr}.item{grid-template-columns:44px 1fr}.item img{width:44px;height:56px}.item .acts{grid-column:1/-1;justify-content:stretch}}
</style>
</head>
<body>
<div class="admin">

  <section id="loginView" class="hide">
    <h1>Painel Lumière</h1>
    <p class="sub">Acesso restrito à administradora.</p>
    <form id="loginForm" class="card" style="max-width:400px">
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Entrar</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </section>

  <section id="panelView" class="hide">
    <h1>Painel Lumière</h1>
    <p class="sub"><span id="count">0</span> peças na vitrine · <a href="/" target="_blank" class="text-link">ver site ↗</a> · <button id="logout" class="btn ghost" style="min-height:32px;padding:4px 12px;font-size:11px">Sair</button></p>

    <div class="card">
      <h2>Adicionar peça</h2>
      <form id="addForm">
        <div class="row">
          <div class="field">
            <label for="file">Foto</label>
            <input id="file" type="file" accept="image/*" required>
          </div>
          <div class="field">
            <label for="name">Nome da peça</label>
            <input id="name" maxlength="80" placeholder="Conjunto lilás com renda" required>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="category">Categoria</label>
            <select id="category">
              <option value="lingerie">Lingerie</option>
              <option value="pijamas">Pijamas &amp; camisolas</option>
              <option value="masculino">Masculino</option>
              <option value="meias">Meias</option>
            </select>
          </div>
          <div class="field">
            <label for="ref">Referência</label>
            <input id="ref" readonly>
          </div>
        </div>
        <img id="preview" class="hide" alt="">
        <button class="btn" type="submit" id="addBtn">Publicar peça</button>
        <p class="msg" id="addMsg"></p>
      </form>
    </div>

    <div class="card">
      <h2>Peças na vitrine</h2>
      <div class="field">
        <label for="search">Buscar peça (nome, referência ou código da foto)</label>
        <input id="search" type="search" placeholder="Ex: LM057, camisola, WA0057">
      </div>
      <div class="items" id="items"></div>
    </div>
  </section>

</div>
<script src="/admin.js"></script>
</body>
</html>
